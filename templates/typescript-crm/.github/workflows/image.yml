name: Build and release CRM connector

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run validate
        env:
          MCP_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - run: docker build -t mcp-crm:test .

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Normalize the registry namespace
        run: printf 'IMAGE=ghcr.io/%s/mcp-crm\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          attests: |
            type=provenance,mode=max
            type=sbom,generator=docker.io/docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      - name: Record native build subject
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          mkdir -p receipts
          node scripts/release-evidence.mjs record "$IMAGE" "$GITHUB_SHA" "$ARCH" "$DIGEST" > "receipts/$ARCH.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crm-subject-${{ matrix.platform.arch }}-${{ github.ref_name }}
          path: receipts/${{ matrix.platform.arch }}.json
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Normalize the registry namespace
        run: printf 'IMAGE=ghcr.io/%s/mcp-crm\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: crm-subject-*-${{ github.ref_name }}
          path: receipts
          merge-multiple: true
      - name: Assemble attested native subjects into the final index
        id: merge
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mkdir -p "release"
          node scripts/release-evidence.mjs sources "$IMAGE" "$GITHUB_SHA" receipts/*.json > "release/sources.txt"
          mapfile -t sources < "release/sources.txt"
          mapfile -t tags <<< "$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do tag_args+=(--tag "$tag"); done
          docker buildx imagetools create "${tag_args[@]}" --metadata-file "release/merge.json" "${sources[@]}"
          digest=$(node scripts/release-evidence.mjs digest "release/merge.json")
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Record digest metadata and validate the merged index
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > release/image.txt
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > release/index.json
          node scripts/release-evidence.mjs index release/index.json
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # nested in trivy-action v0.36.0
        with:
          version: v0.74.0
          cache: true
      - name: Scan both image variants
        run: |
          trivy image --platform linux/amd64 --scanners vuln --format json --output release/trivy-amd64.json "$IMAGE@${{ steps.merge.outputs.digest }}"
          trivy image --platform linux/arm64 --scanners vuln --format json --output release/trivy-arm64.json "$IMAGE@${{ steps.merge.outputs.digest }}"
          node -e 'for (const f of process.argv.slice(1)) { const r=require("./"+f); if (r.Results?.some(x => x.Vulnerabilities?.length)) process.exitCode=1 }' release/trivy-amd64.json release/trivy-arm64.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign immutable digest
        env:
          COSIGN_YES: 'true'
        run: cosign sign "$IMAGE@${{ steps.merge.outputs.digest }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crm-release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 30
