name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  image-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: abra-flexi
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=abra-flexi
          - id: byzdata
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=byzdata
          - id: fakturoid
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=fakturoid
          - id: gemini-deep-research
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=gemini-deep-research
          - id: merk
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=merk
          - id: postgres
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=postgres
          - id: toggl
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=toggl
          - id: catalog
            dockerfile: Dockerfile.catalog
            build_args: ''
          - id: bundle
            dockerfile: Dockerfile.bundle
            build_args: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: false
          tags: local/mcp-${{ matrix.id }}:ci

  crm-template-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/check-template-context.mjs
      - run: docker build -t local/mcp-crm:ci templates/typescript-crm
      - run: npm --prefix templates/typescript-crm run check:file-secret -- local/mcp-crm:ci
