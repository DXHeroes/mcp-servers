name: Release container images

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Match tag to repository version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"

  build:
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        target:
          - id: abra-flexi
            image: ghcr.io/dxheroes/mcp-abra-flexi
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=abra-flexi
          - id: byzdata
            image: ghcr.io/dxheroes/mcp-byzdata
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=byzdata
          - id: fakturoid
            image: ghcr.io/dxheroes/mcp-fakturoid
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=fakturoid
          - id: gemini-deep-research
            image: ghcr.io/dxheroes/mcp-gemini-deep-research
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=gemini-deep-research
          - id: merk
            image: ghcr.io/dxheroes/mcp-merk
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=merk
          - id: postgres
            image: ghcr.io/dxheroes/mcp-postgres
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=postgres
          - id: toggl
            image: ghcr.io/dxheroes/mcp-toggl
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=toggl
          - id: catalog
            image: ghcr.io/dxheroes/mcp-catalog
            dockerfile: Dockerfile.catalog
            build_args: ''
          - id: bundle
            image: ghcr.io/dxheroes/mcp-bundle
            dockerfile: Dockerfile.bundle
            build_args: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.target.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          build-args: ${{ matrix.target.build_args }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ matrix.target.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          attests: |
            type=provenance,mode=max
            type=sbom,generator=docker.io/docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      - name: Record native build subject
        env:
          IMAGE: ${{ matrix.target.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          mkdir -p receipts
          node templates/typescript-crm/scripts/release-evidence.mjs record "$IMAGE" "$GITHUB_SHA" "$ARCH" "$DIGEST" > "receipts/$ARCH.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subject-${{ matrix.target.id }}-${{ matrix.platform.arch }}-${{ github.ref_name }}
          path: receipts/${{ matrix.platform.arch }}.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: abra-flexi
            image: ghcr.io/dxheroes/mcp-abra-flexi
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=abra-flexi
          - id: byzdata
            image: ghcr.io/dxheroes/mcp-byzdata
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=byzdata
          - id: fakturoid
            image: ghcr.io/dxheroes/mcp-fakturoid
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=fakturoid
          - id: gemini-deep-research
            image: ghcr.io/dxheroes/mcp-gemini-deep-research
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=gemini-deep-research
          - id: merk
            image: ghcr.io/dxheroes/mcp-merk
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=merk
          - id: postgres
            image: ghcr.io/dxheroes/mcp-postgres
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=postgres
          - id: toggl
            image: ghcr.io/dxheroes/mcp-toggl
            dockerfile: Dockerfile.connector
            build_args: CONNECTOR=toggl
          - id: catalog
            image: ghcr.io/dxheroes/mcp-catalog
            dockerfile: Dockerfile.catalog
            build_args: ''
          - id: bundle
            image: ghcr.io/dxheroes/mcp-bundle
            dockerfile: Dockerfile.bundle
            build_args: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: subject-${{ matrix.id }}-*-${{ github.ref_name }}
          path: receipts
          merge-multiple: true
      - name: Assemble attested native subjects into the final index
        id: merge
        env:
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mkdir -p "release/${{ matrix.id }}"
          node templates/typescript-crm/scripts/release-evidence.mjs sources "$IMAGE" "$GITHUB_SHA" receipts/*.json > "release/${{ matrix.id }}/sources.txt"
          mapfile -t sources < "release/${{ matrix.id }}/sources.txt"
          mapfile -t tags <<< "$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do tag_args+=(--tag "$tag"); done
          docker buildx imagetools create "${tag_args[@]}" --metadata-file "release/${{ matrix.id }}/merge.json" "${sources[@]}"
          digest=$(node templates/typescript-crm/scripts/release-evidence.mjs digest "release/${{ matrix.id }}/merge.json")
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Record immutable release evidence
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.merge.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p "release/${{ matrix.id }}"
          printf '{"image":"%s","digest":"%s","version":"%s","platforms":["linux/amd64","linux/arm64"]}\n' "$IMAGE" "$DIGEST" "$VERSION" > "release/${{ matrix.id }}/digest.json"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > "release/${{ matrix.id }}/index.json"
          node scripts/check-oci-index.mjs "release/${{ matrix.id }}/index.json"
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # nested in trivy-action v0.36.0
        with:
          version: v0.74.0
          cache: true
      - name: Scan both published platform manifests
        env:
          IMAGE_REF: ${{ matrix.image }}@${{ steps.merge.outputs.digest }}
        run: |
          trivy image --platform linux/amd64 --scanners vuln --format json --output "release/${{ matrix.id }}/trivy-amd64.json" "$IMAGE_REF"
          trivy image --platform linux/arm64 --scanners vuln --format json --output "release/${{ matrix.id }}/trivy-arm64.json" "$IMAGE_REF"
          node scripts/check-trivy-reports.mjs "release/${{ matrix.id }}/trivy-amd64.json" "release/${{ matrix.id }}/trivy-arm64.json"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the multi-platform index digest
        env:
          COSIGN_YES: 'true'
        run: cosign sign "${{ matrix.image }}@${{ steps.merge.outputs.digest }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.id }}-${{ github.ref_name }}
          path: release/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 30
